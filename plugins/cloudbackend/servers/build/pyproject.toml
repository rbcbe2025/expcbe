[project]
name = "cbemcp-build"
version = "1.0.0"
description = "CloudBackend PaaS build tools for XIOS/3 packages: lint, scaffold, benchmark, as an MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "xmlschema>=4.3.2",
    "pydantic",
]

[project.scripts]
cbemcp-build = "cbemcp_build.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cbemcp_build"]
