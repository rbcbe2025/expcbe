<html><head><meta charset="utf-8"/><meta name="app" content="/index.xml"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script>var boot={runtime:"/xios",titlePrefix:"",startup:"/index.xml",tenant:"$TENANTNAME$",tenantId:"$TENANTID$",theme:"cbeapps",datatypes:".types.xml"}</script>
<script>/* The runtime's login card is width="470"; once each view frame has loaded, this gives it one rule so the card fits a phone. Remove it when the login view is responsive (reported to XIOS/3, 2026-11-05). */(function(){var css="@media (max-width:520px){.signupCard{width:min(470px,calc(100vw - 24px))!important;padding:28px 20px!important}}";function fit(f){try{var d=f.contentDocument;if(d&&d.readyState==="complete"&&d.head&&!d.getElementById("cbe-fit")){var s=d.createElement("style");s.id="cbe-fit";s.textContent=css;d.head.appendChild(s);}}catch(e){}}new MutationObserver(function(){var fs=document.getElementsByTagName("iframe");for(var i=0;i<fs.length;i++){if(!fs[i].cbeFit){fs[i].cbeFit=1;fs[i].addEventListener("load",function(){var f=this;setTimeout(function(){fit(f);},0);});}}}).observe(document.documentElement,{childList:true,subtree:true});})();</script>
</head>
<body style="background-color:#fff;">
<div id="activityLayer" style="width:64px;height:64px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9999;contain:strict"><svg class="!circular" viewBox="25 25 50 50"><style>@keyframes dash{0%{stroke-dasharray:1,200;stroke-dashoffset:0}50%{stroke-dasharray:89,200;stroke-dashoffset:-35}100%{stroke-dasharray:89,200;stroke-dashoffset:-124}}.\!circular{animation:rotate 2s linear infinite;transform-origin:center center}@keyframes rotate{100%{transform:rotate(360deg)}}.\!path{stroke-dasharray:1,200;animation:dash 1.5s ease-in-out infinite;stroke-linecap:round;stroke:#000;stroke-width:3;fill:none}</style><circle class="!path" cx="50" cy="50" r="20"></circle></svg></div>
<script src="/xios/boot.js"></script>
</body></html>
