<script>var boot={runtime:"/xios",titlePrefix:"",startup:"/index.xml",tenant:"$TENANTNAME$",tenantId:"$TENANTID$",theme:"cbeapps",datatypes:".types.xml"}</script>
<script>/* Two fixes the runtime does not make yet (reported to XIOS/3, 2026-11-05); remove each when it does. 1. The login card is width="470" and drawn in an older style: each view frame gets rules that fit the card to a phone and give the sign-in page a modern look (the system type, 44 px fields and button, the app's button colour on focus). A frame is touched only once the runtime has built it (its !baseCss is in place): writing into a frame the runtime is still setting up can stall the boot (measured 2026-11-05). 2. A dialog opens in a frame of its own with the platform's theme: each dialog frame gets the app's theme (the app frame's theme variables and the design kit's stylesheet), and the rule after this script keeps dialogs inside a phone's width. */(function(){var css=".signupCard,.signupCard *{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif!important}.signupCard{border-radius:18px!important;box-shadow:0 2px 6px rgba(0,0,0,.08),0 24px 60px -12px rgba(0,0,0,.4)!important}.signupTitle{font-size:26px!important;font-weight:600!important;letter-spacing:-.02em}.signupSubtitle{font-size:15px!important}.signupCard .label{font-size:13px!important;font-weight:500!important;color:var(--signup-label-text,#16375d)!important}.signupCard .xios-input{min-height:44px;box-sizing:border-box;border-radius:12px!important;background:rgba(15,23,42,.05)!important;border:1px solid transparent!important}.signupCard .xios-input:focus-within{background:#fff!important;border-color:var(--signup-primary-bg,#1d6fc4)!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--signup-primary-bg,#1d6fc4) 22%,transparent)!important;outline:0!important}.signupCard .xios-input input{font-size:16px!important;background:transparent!important;padding-left:14px!important;padding-right:10px!important}.xios-button.signupPrimary{min-height:44px!important;border-radius:12px!important;font-size:16px!important;font-weight:600!important}.signupLink{text-decoration:none!important;font-weight:500}.signupLink:hover{text-decoration:underline!important}@media (max-width:520px){.signupCard{width:min(470px,calc(100vw - 24px))!important;padding:28px 20px!important}}";function add(d,id,text){if(!d.getElementById(id)){var s=d.createElement("style");s.id=id;s.textContent=text;d.head.appendChild(s);}}function appTheme(){var fs=document.getElementsByTagName("iframe");for(var i=0;i<fs.length;i++){if(/^GUI_Dialog_/.test(fs[i].id))continue;try{var a=fs[i].contentDocument,ss=a.getElementsByTagName("style");for(var j=0;j<ss.length;j++){if(ss[j].textContent.indexOf("--dk-fill")>-1){var t=a.getElementById("!themeCss");return (t?t.textContent:"")+"\n"+ss[j].textContent;}}}catch(e){}}return "";}function fit(f,n){try{var d=f.contentDocument;if(!d||!d.head||!d.getElementById("!baseCss")){if(n<40)setTimeout(function(){fit(f,n+1);},250);return;}add(d,"cbe-fit",css);if(/^GUI_Dialog_/.test(f.id)){var t=appTheme();if(t)add(d,"cbe-theme",t);}}catch(e){}}new MutationObserver(function(){var fs=document.getElementsByTagName("iframe");for(var i=0;i<fs.length;i++){if(!fs[i].cbeFit){fs[i].cbeFit=1;fs[i].addEventListener("load",function(){var f=this;setTimeout(function(){fit(f,0);},250);});}}}).observe(document.documentElement,{childList:true,subtree:true});})();</script>
<style>@media (max-width:520px){div[id^="GUI_Dialog_"][id$="_iframe"],div[id^="GUI_Dialog_"][id$="_dragElt"]{left:12px!important;width:calc(100vw - 24px)!important}iframe[id^="GUI_Dialog_"]{width:100%!important}}</style>
</head>
